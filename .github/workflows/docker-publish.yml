name: Build and Publish Docker Image

on:
  push:
    tags:
      - '[0-9]*'        # push a numeric tag (e.g. 12) -> build the pre-release image
  release:
    types: [published]  # publish a release          -> promote that image to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Run the bundled JavaScript actions on Node.js 24 now; they otherwise default
  # to the deprecated Node.js 20 runtime until GitHub flips the default (2026-06-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── On a tag push ───────────────────────────────────────────────────────────
  # Build the multi-arch image and push it to GHCR under a deliberately opaque,
  # unique tag: sha-<full commit sha>. This is the tested pre-release artifact.
  # It is NOT tagged `latest` or with any version name.
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Build and push pre-release image (by commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── On a published release ──────────────────────────────────────────────────
  # Reuse the image already built for this commit and add the release name +
  # `latest` to it, with no rebuild (byte-for-byte identical to the tested one).
  # If that pre-release image is missing, build from scratch and push instead.
  # The published version tag is the release name (github.event.release.tag_name).
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names
        id: names
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"   # GHCR requires a lowercase path
          echo "image=$IMAGE"                 >> "$GITHUB_OUTPUT"
          echo "staged=$IMAGE:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"             >> "$GITHUB_OUTPUT"

      - name: Check for the pre-release image
        id: staged
        run: |
          if docker buildx imagetools inspect "${{ steps.names.outputs.staged }}" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote pre-release image (no rebuild)
        if: steps.staged.outputs.exists == 'true'
        run: |
          docker buildx imagetools create \
            -t "${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}" \
            -t "${{ steps.names.outputs.image }}:latest" \
            "${{ steps.names.outputs.staged }}"

      - name: Build and push (fallback — no pre-release image found)
        if: steps.staged.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
